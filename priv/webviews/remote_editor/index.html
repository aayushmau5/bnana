<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      @font-face { font-family: Playfair; src: local("PlayfairDisplay-Regular"), url("../../fonts/PlayfairDisplay-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Share Tech Mono"; src: local("ShareTechMono-Regular"), url("../../fonts/ShareTechMono-Regular.ttf") format("truetype"); }
      :root { color-scheme: dark; --bg:#121212; --surface:#181818; --raised:#202020; --line:#2f363d; --text:#dbd7ca; --muted:#95938c; --green:#4d9375; --gold:#e6cc77; --red:#cb7676; --mono:"Share Tech Mono",ui-monospace,monospace; --serif:Playfair,Georgia,serif; }
      * { box-sizing: border-box; }
      html, body { min-height:100%; margin:0; background:var(--bg); color:var(--text); }
      body { padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); font-family:var(--serif); }
      nav { display:grid; grid-template-columns:44px 1fr 84px; align-items:center; gap:6px; margin-bottom:24px; padding:5px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
      button { min-height:42px; border:0; border-radius:8px; font-family:var(--mono); font-size:14px; }
      #back { background:transparent; color:var(--gold); font-size:20px; }
      #save { background:var(--green); color:#121212; }
      #save[disabled] { opacity:.6; }
      #state { overflow:hidden; color:var(--muted); font-family:var(--mono); font-size:12px; text-align:center; text-overflow:ellipsis; white-space:nowrap; }
      main { display:grid; gap:18px; }
      h1 { margin:0 0 4px; font-size:38px; line-height:1.05; }
      section { display:grid; gap:8px; }
      label { color:var(--muted); font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
      input, textarea, select { display:block; width:100%; margin:0; border:1px solid var(--line); border-radius:10px; outline:none; background:var(--surface); color:var(--text); }
      input:focus, textarea:focus, select:focus { border-color:var(--green); }
      input { min-height:52px; padding:12px 14px; font:23px var(--serif); }
      textarea { min-height:50dvh; padding:14px; resize:none; font-family:var(--mono); font-size:16px; line-height:1.65; caret-color:var(--green); }
      select { min-height:52px; padding:0 14px; font-family:var(--mono); font-size:14px; }
      .error { color:var(--red) !important; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <nav>
      <button id="back" type="button">←</button>
      <span id="state">ready</span>
      <button id="save" type="button">Save</button>
    </nav>
    <main>
      <h1 id="heading">Editor</h1>
      <section id="title-wrap" hidden>
        <label for="title">Title</label>
        <input id="title" autocomplete="off" placeholder="Give it a name" />
      </section>
      <section id="expiry-wrap" hidden>
        <label for="expiry">Keep it for</label>
        <select id="expiry"><option value="hour">One hour</option><option value="day">One day</option><option value="week">One week</option></select>
      </section>
      <section>
        <label id="body-label" for="body">Content</label>
        <textarea id="body" spellcheck="true" placeholder="Start here…"></textarea>
      </section>
    </main>
    <script>
      (() => {
        const title = document.getElementById("title");
        const body = document.getElementById("body");
        const expiry = document.getElementById("expiry");
        const save = document.getElementById("save");
        const state = document.getElementById("state");
        const withMob = (callback) => window.mob && typeof window.mob.send === "function" ? callback(window.mob) : setTimeout(() => withMob(callback), 30);
        const send = (event) => withMob((mob) => mob.send({event, title:title.value, body:body.value, expiry:expiry.value}));
        const changed = () => { state.textContent = "unsaved"; state.className = ""; send("change"); };
        title.addEventListener("input", changed); body.addEventListener("input", changed); expiry.addEventListener("change", changed);
        document.getElementById("back").addEventListener("click", () => send("back"));
        save.addEventListener("click", () => send("save"));
        withMob((mob) => {
          mob.onMessage((message) => {
            if (message.event === "init") {
              document.getElementById("heading").textContent = message.heading || "Editor";
              document.getElementById("body-label").textContent = message.body_label || "Content";
              document.getElementById("title-wrap").hidden = !message.show_title;
              document.getElementById("expiry-wrap").hidden = !message.show_expiry;
              title.value = message.title || ""; body.value = message.body || ""; expiry.value = message.expiry || "day";
            }
            if (message.event === "save_state") {
              const saving = message.state === "saving";
              save.disabled = saving;
              state.textContent = saving ? "saving…" : (message.message || message.state);
              state.className = message.state === "error" ? "error" : "";
            }
          });
          mob.send({event:"ready"});
        });
      })();
    </script>
  </body>
</html>
